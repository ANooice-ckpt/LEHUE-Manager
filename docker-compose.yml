services:
  api:
    build:
      context: ./server
    container_name: lehue-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LEHUE_ENV: ${LEHUE_ENV:?Set LEHUE_ENV=test or LEHUE_ENV=prod before starting}
      DATA_ROOT: /app/data
    volumes:
      - ./server/data:/app/data
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    container_name: lehue-caddy
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
