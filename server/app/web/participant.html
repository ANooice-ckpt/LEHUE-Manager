<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>LEHUE Study</title>
  <style>
    :root{--bg:#f7f7f5;--card:#fff;--text:#111;--muted:#666;--line:#e8e8e3;--soft:#f0f0ec;--ok:#1d6b3a;--warn:#8a5a00;--danger:#8a3b12;--radius:18px}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -8%,rgba(17,17,17,.08),transparent 34%),linear-gradient(180deg,#fbfbf8 0%,var(--bg) 100%);color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    button,input,textarea{font:inherit}.page{width:min(560px,100%);margin:0 auto;padding:24px 16px 36px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:0 14px 36px rgba(0,0,0,.055)}
    .meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase}.status-dot{display:inline-flex;align-items:center;gap:7px}.status-dot:before{content:"";width:7px;height:7px;border-radius:50%;background:#111;box-shadow:0 0 0 4px rgba(17,17,17,.08)}h1{margin:12px 0 0;font-size:28px;line-height:1.12;letter-spacing:-.04em}.en{color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin:4px 0 0}.subtitle{color:var(--muted);margin:12px 0 0}.progress{margin:18px 0 8px;padding:13px 14px;border-radius:14px;background:var(--soft)}.progress-row{display:flex;justify-content:space-between}.track{height:8px;background:#deded7;border-radius:99px;overflow:hidden;margin-top:9px}.track>div{height:100%;background:#111;border-radius:99px;width:0}.section{margin:20px 0 9px;color:var(--muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center;gap:10px}.section:after{content:"";height:1px;background:var(--line);flex:1}.tasks{display:grid;gap:10px}.task{width:100%;text-align:left;border:1px solid var(--line);border-radius:14px;background:#fff;padding:14px 15px;display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;color:var(--text)}button.task{cursor:pointer}.task.primary{background:#111;color:white;border-color:#111}.task.done{background:#edf7f0;border-color:#d6eadc;color:#174f2e}.task.disabled{opacity:.55}.code{width:34px;height:30px;border-radius:9px;background:rgba(0,0,0,.06);display:flex;align-items:center;justify-content:center;font-weight:750;font-size:12px}.primary .code{background:rgba(255,255,255,.12)}.name{font-size:16px;font-weight:700;line-height:1.3}.desc{font-size:12px;opacity:.7;margin-top:3px}.right{font-size:18px;opacity:.65}.notice{margin-top:16px;padding:13px 14px;border-radius:14px;background:#fff7ed;border:1px solid #f3dcc7;color:var(--danger)}.hidden{display:none!important}.error{padding:16px;color:var(--danger)}
    .form-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.back{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;cursor:pointer}.q{padding:18px 0;border-bottom:1px solid var(--line)}.q:last-child{border-bottom:0}.q-title{display:block;font-weight:700;margin-bottom:10px}.required{color:var(--danger);margin-right:4px}.q input[type=number],.q input[type=time],.q textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff}.q textarea{min-height:90px;resize:vertical}.scale-ends{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:7px}.scale-options{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.scale-option{display:grid;place-items:center;gap:4px;border:1px solid var(--line);border-radius:10px;padding:8px 2px;background:#fff;cursor:pointer}.scale-option input{margin:0}.options{display:grid;gap:8px}.option{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-radius:11px;padding:10px 11px;background:#fff;cursor:pointer}.option input{margin:3px 0 0;flex:0 0 auto}.matrix{display:grid;gap:12px}.matrix-row{padding:12px;border-radius:12px;background:var(--soft)}.matrix-label{font-weight:700;margin-bottom:8px}.matrix-options{display:grid;grid-template-columns:1fr 1fr;gap:7px}.matrix-options .option{padding:8px;font-size:13px}.upload-fields{display:grid;gap:12px;margin-top:18px}.upload-fields label{display:grid;gap:6px;font-weight:700}.upload-fields input{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff}.submit{width:100%;margin-top:16px;border:0;border-radius:14px;background:#111;color:#fff;padding:13px 15px;font-weight:700;cursor:pointer}.submit:disabled{opacity:.5}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:14px}
  </style>
</head>
<body>
<main class="page">
  <section id="loading" class="card"><div class="subtitle">正在读取今日实验任务…</div></section>
  <section id="home" class="card hidden">
    <div class="meta"><span>Participant Console</span><span class="status-dot">Online</span></div>
    <h1 id="studyTitle">光迹计划（北京）</h1><div class="en">LEHUE Study</div>
    <p class="subtitle">这是你的专属工作入口。每天从这里查看并完成实验任务，无需填写姓名或被试编号。</p>
    <div class="progress"><div class="progress-row"><strong id="dayText">实验进度</strong><span id="dateText" class="subtitle" style="margin:0"></span></div><div class="track"><div id="progressBar"></div></div></div>
    <div class="section">今日任务</div><div id="tasks" class="tasks"></div>
    <div class="notice" id="notice"></div>
  </section>
  <section id="formView" class="card hidden"><div class="form-head"><div><div class="meta">Daily Questionnaire</div><h1 id="formTitle" style="font-size:24px"></h1><p class="subtitle" id="formDesc"></p></div><button id="backBtn" class="back">返回</button></div><div id="questions"></div><div id="formError" class="error"></div><button id="submitBtn" class="submit">提交今日记录</button></section>
  <section id="lightView" class="card hidden"><div class="form-head"><div><div class="meta">Lighting Data</div><h1 style="font-size:24px">上传光照记录</h1><p class="subtitle">选择设备导出的原始 CSV、XLSX 或 TXT 文件。系统会检查文件名、记录数和有效率。</p></div><button id="lightBackBtn" class="back">返回</button></div><div class="upload-fields"><label>暴露日期<input id="lightDate" type="date"></label><label>Lighting 原始文件<input id="lightFile" type="file" accept=".csv,.xlsx,.txt"></label></div><div id="lightError" class="error"></div><button id="lightSubmitBtn" class="submit">上传并检查</button></section>
  <p class="footer">如设备或页面异常，请直接联系主试。</p>
</main>
<script>
const token=decodeURIComponent(location.pathname.split('/').pop()||'');let state=null,currentForm=null;
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});let data={};try{data=await r.json()}catch{}if(!r.ok)throw new Error(data.detail||`HTTP ${r.status}`);return data}
function gpsText(g){if(g.status==='live')return ['GPS记录','正在回传','done'];if(g.status==='stale')return ['GPS记录','最近回传较久，请确认 OwnTracks 正常',''];if(g.status==='offline')return ['GPS记录','较长时间未收到回传，请检查手机记录',''];return ['GPS记录','尚未收到 GPS 回传','']}
function showHome(){currentForm=null;$('formView').classList.add('hidden');$('lightView').classList.add('hidden');$('home').classList.remove('hidden')}
function lightText(x){if(x.quality==='valid')return [`已上传 · 有效率 ${Number(x.valid_pct).toFixed(1)}%`,'done','✓'];if(x.quality==='insufficient')return [`已上传，但有效率仅 ${Number(x.valid_pct).toFixed(1)}%，可重新上传`,'','!'];if(x.quality==='unreadable')return ['文件无法解析，请检查或重新上传','','!'];return ['上传今日 Lighting 原始文件','','›']}
function render(){$('loading').classList.add('hidden');$('home').classList.remove('hidden');$('studyTitle').textContent=state.study_title;$('dateText').textContent=state.date_local;const d=state.study_day,total=state.total_days;$('dayText').textContent=d>0?`Day ${d} / ${total}`:'实验尚未开始';$('progressBar').style.width=`${Math.max(0,Math.min(100,d>0?d/total*100:0))}%`;const rows=[];state.forms.forEach((f,i)=>{const enabled=state.status==='running'&&!f.completed;rows.push(`<button class="task ${f.completed?'done':enabled?'primary':'disabled'}" data-form="${esc(f.key)}" ${enabled?'':'disabled'}><span class="code">0${i+1}</span><span><div class="name">${esc(f.title)}</div><div class="desc">${f.completed?'今日已提交':esc(f.description)}</div></span><span class="right">${f.completed?'✓':'›'}</span></button>`)});const lightEnabled=state.status==='running';const [ld,lc,lr]=lightText(state.lighting||{});rows.push(`<button class="task ${lc||(!lightEnabled?'disabled':'')}" data-lighting ${lightEnabled?'':'disabled'}><span class="code">LUX</span><span><div class="name">Lighting 光照记录</div><div class="desc">${esc(ld)}</div></span><span class="right">${lr}</span></button>`);const [gn,gd,gc]=gpsText(state.gps);rows.push(`<div class="task ${gc}"><span class="code">GPS</span><span><div class="name">${gn}</div><div class="desc">${gd}</div></span><span class="right">${state.gps.status==='live'?'✓':'·'}</span></div>`);$('tasks').innerHTML=rows.join('');$('notice').textContent=state.notice;document.querySelectorAll('[data-form]').forEach(b=>b.addEventListener('click',()=>openForm(b.dataset.form)));document.querySelectorAll('[data-lighting]').forEach(b=>b.addEventListener('click',openLighting))}
  function questionTitle(q){return `<div class="q-title">${q.required?'<span class="required">*</span>':''}${q.source_number?`${q.source_number}. `:''}${esc(q.label)}</div>`}
  function renderOptions(q,type){return `<div class="options">${q.options.map(o=>`<label class="option"><input type="${type}" name="q_${esc(q.key)}" value="${esc(o.value)}"><span>${esc(o.label)}</span></label>`).join('')}</div>`}
  function renderQuestion(q){const title=questionTitle(q);if(q.type==='scale'){const values=Array.from({length:q.max-q.min+1},(_,i)=>q.min+i);return `<div class="q">${title}<div class="scale-ends"><span>${esc(q.low||q.min)}</span><span>${esc(q.high||q.max)}</span></div><div class="scale-options">${values.map(value=>`<label class="scale-option"><input type="radio" name="q_${esc(q.key)}" value="${value}"><span>${value}</span></label>`).join('')}</div></div>`}if(q.type==='time')return `<div class="q">${title}<input data-answer="${esc(q.key)}" type="time"></div>`;if(q.type==='number')return `<div class="q">${title}<input data-answer="${esc(q.key)}" type="number" min="${q.min}" max="${q.max}" step="${q.step||1}" placeholder="${esc(q.unit||'')}"></div>`;if(q.type==='choice')return `<div class="q">${title}${renderOptions(q,'radio')}</div>`;if(q.type==='multichoice')return `<div class="q" data-multichoice="${esc(q.key)}">${title}${renderOptions(q,'checkbox')}</div>`;if(q.type==='matrix')return `<div class="q">${title}<div class="matrix">${q.rows.map(row=>`<div class="matrix-row"><div class="matrix-label">${esc(row.label)}</div><div class="matrix-options">${q.options.map(o=>`<label class="option"><input type="radio" name="q_${esc(q.key)}_${esc(row.key)}" value="${esc(o.value)}"><span>${esc(o.label)}</span></label>`).join('')}</div></div>`).join('')}</div></div>`;return `<div class="q">${title}<textarea data-answer="${esc(q.key)}" placeholder="${esc(q.placeholder||'')}"></textarea></div>`}
  function openForm(key){const f=state.forms.find(x=>x.key===key);if(!f||f.completed)return;currentForm=f;$('home').classList.add('hidden');$('formView').classList.remove('hidden');$('formTitle').textContent=f.title;$('formDesc').textContent=f.description;$('formError').textContent='';$('questions').innerHTML=f.questions.map(renderQuestion).join('');document.querySelectorAll('[data-multichoice]').forEach(group=>group.addEventListener('change',event=>{if(event.target.value==='none'&&event.target.checked)group.querySelectorAll('input:not([value=none])').forEach(x=>x.checked=false);if(event.target.value!=='none'&&event.target.checked){const none=group.querySelector('input[value=none]');if(none)none.checked=false}}));scrollTo({top:0,behavior:'smooth'})}
  function collectAnswers(){const answers={};for(const q of currentForm.questions){if(['number','time','text'].includes(q.type)){answers[q.key]=document.querySelector(`[data-answer="${q.key}"]`)?.value??''}else if(['choice','scale'].includes(q.type)){answers[q.key]=document.querySelector(`input[name="q_${q.key}"]:checked`)?.value??''}else if(q.type==='multichoice'){answers[q.key]=[...document.querySelectorAll(`input[name="q_${q.key}"]:checked`)].map(x=>x.value)}else if(q.type==='matrix'){answers[q.key]=Object.fromEntries(q.rows.map(row=>[row.key,document.querySelector(`input[name="q_${q.key}_${row.key}"]:checked`)?.value??'']))}}return answers}
  async function submitForm(){if(!currentForm)return;const answers=collectAnswers();$('submitBtn').disabled=true;$('formError').textContent='';try{await api(`/api/v1/portal/${encodeURIComponent(token)}/questionnaires/${encodeURIComponent(currentForm.key)}`,{method:'POST',body:JSON.stringify({answers})});state=await api(`/api/v1/portal/${encodeURIComponent(token)}`);render();showHome()}catch(e){$('formError').textContent=e.message;$('formError').scrollIntoView({behavior:'smooth',block:'center'})}finally{$('submitBtn').disabled=false}}
function openLighting(){$('home').classList.add('hidden');$('lightView').classList.remove('hidden');$('lightDate').value=state.date_local;$('lightError').textContent=''}
async function submitLighting(){const file=$('lightFile').files[0];if(!file){$('lightError').textContent='请选择 Lighting 原始文件';return}$('lightSubmitBtn').disabled=true;$('lightError').textContent='';try{const url=`/api/v1/portal/${encodeURIComponent(token)}/lighting?date_local=${encodeURIComponent($('lightDate').value)}&filename=${encodeURIComponent(file.name)}`;const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:file});let data={};try{data=await response.json()}catch{}if(!response.ok)throw new Error(data.detail||`HTTP ${response.status}`);state=await api(`/api/v1/portal/${encodeURIComponent(token)}`);render();showHome()}catch(e){$('lightError').textContent=e.message}finally{$('lightSubmitBtn').disabled=false}}
async function boot(){try{state=await api(`/api/v1/portal/${encodeURIComponent(token)}`);render()}catch(e){$('loading').innerHTML=`<div class="error"><strong>无法打开专属工作入口</strong><br>${esc(e.message)}</div>`}}
$('backBtn').addEventListener('click',showHome);$('lightBackBtn').addEventListener('click',showHome);$('submitBtn').addEventListener('click',submitForm);$('lightSubmitBtn').addEventListener('click',submitLighting);boot();
</script>
</body>
</html>
